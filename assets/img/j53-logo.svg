<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">J53 — JARVIS 53</title><desc id="desc">Metallic gold J53 monogram inside an illuminated precision-engineered circular emblem.</desc>
